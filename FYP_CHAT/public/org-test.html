<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat as an organization (test page)</title>
    <style>
      :root { --navy: #0b1f3a; --gold: #f2b705; --sand: #f3efe7; --muted: #6b6558; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--sand); color: var(--navy); }
      header { background: var(--navy); color: #fff; padding: 0.9rem 1.2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
      header strong { color: var(--gold); }
      select, button, input { font: inherit; padding: 0.55rem 0.8rem; border-radius: 0.6rem; border: 1px solid #d8d1c2; }
      button { background: var(--gold); border-color: var(--gold); font-weight: 700; cursor: pointer; }
      main { max-width: 42rem; margin: 1rem auto; background: #fff; border-radius: 1rem; display: flex; flex-direction: column; height: calc(100vh - 7rem); overflow: hidden; box-shadow: 0 8px 30px rgba(11, 31, 58, 0.12); }
      #warn { background: #fff3cd; padding: 0.6rem 1rem; font-size: 0.85rem; }
      #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; background: #efeae2; }
      .bubble { max-width: 75%; padding: 0.5rem 0.8rem; border-radius: 0.8rem; background: #fff; align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; }
      .bubble.me { align-self: flex-end; background: #ffe9a6; }
      .bubble small { display: block; text-align: right; color: var(--muted); font-size: 0.7rem; margin-top: 0.2rem; }
      form { display: flex; gap: 0.5rem; padding: 0.7rem; border-top: 1px solid #eee; }
      form input { flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <span>Chat as an <strong>organization</strong> (test only)</span>
      <select id="who"></select>
      <button id="connect" type="button">Connect</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="warn">Test page: the organization portal does not exist yet, so this page lets you play the organization. Messages go to the manager's Chat page in real time.</div>
      <div id="messages"></div>
      <form id="form">
        <input id="text" autocomplete="off" placeholder="Type a message" maxlength="2000" disabled />
        <button type="submit" id="send" disabled>Send</button>
      </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      let socket = null
      let current = null

      const time = (value) => new Date(value.endsWith('Z') ? value : value + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      // The API answers in camelCase; both spellings are accepted.
      const pick = (m, a, b) => (m[a] !== undefined ? m[a] : m[b])
      function show(message) {
        const own = pick(message, 'senderType', 'SenderType') === 'Organization'
        const div = document.createElement('div')
        div.className = 'bubble' + (own ? ' me' : '')
        div.textContent = pick(message, 'body', 'Body')
        const small = document.createElement('small')
        small.textContent = (own ? 'You' : 'Manager') + ' · ' + time(pick(message, 'createdAt', 'CreatedAt'))
        div.appendChild(small)
        $('messages').appendChild(div)
        $('messages').scrollTop = $('messages').scrollHeight
      }

      fetch('/dev/organizations').then((r) => r.json()).then((rows) => {
        if (!Array.isArray(rows) || rows.length === 0) { $('status').textContent = 'No organization has a manager yet.'; return }
        $('who').innerHTML = rows.map((r, i) => '<option value="' + i + '">' + r.name + ' ⇄ ' + r.managerName + '</option>').join('')
        window.rows = rows
      }).catch(() => { $('status').textContent = 'Cannot reach the API.' })

      $('connect').onclick = () => {
        const row = (window.rows || [])[Number($('who').value)]
        if (!row) return
        if (socket) socket.close()
        current = row
        $('messages').innerHTML = ''
        socket = io({ auth: { devOrgId: row.organizationId, devManagerUserId: row.managerUserId } })
        socket.on('connect_error', (e) => { $('status').textContent = 'Refused: ' + e.message + ' (is CHAT_DEV_TOOLS=true?)' })
        socket.on('chat:ready', () => {
          $('status').textContent = 'Connected as ' + row.name
          $('text').disabled = false; $('send').disabled = false
          socket.emit('chat:history', {}, (r) => { if (r.ok) r.messages.forEach(show); socket.emit('chat:read', {}) })
        })
        socket.on('chat:message', (m) => { show(m); if (pick(m, 'senderType', 'SenderType') === 'Manager') socket.emit('chat:read', {}) })
        socket.on('disconnect', () => { $('status').textContent = 'Disconnected' })
      }

      $('form').onsubmit = (event) => {
        event.preventDefault()
        const body = $('text').value.trim()
        if (!body || !socket) return
        socket.emit('chat:send', { body }, (r) => { if (!r.ok) $('status').textContent = r.error })
        $('text').value = ''
      }
    </script>
  </body>
</html>
